        function getOnlyAdults(arr){
            var result = [];
            // 배열에서 오브젝트를 하나씩 꺼내오는 것
            for (var item of arr) {
                // 오브젝트에서 name 과 age 를 추출해 오는것
                if(item.age>=20){
                    result.push(item.name);
                }
            }
            return result;
        }
