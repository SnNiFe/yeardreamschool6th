<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Java Script</title>

    <body>

    <script>
        // 문자열 -> 문자+배열
        // 문자 배열을 다루는 오브젝트
        // 소속된 프로퍼티(속성)과 메서드가 존재 한다.
        var str = 'Hello World';
        console.log(str.length);
        console.log(str[0]); // 배열 개념이므로 인덱스가 존재한다.
        console.log(str.charAt(1));
        console.log(str.split(' '));
        // 0 번부터 보여주고, 5번부터 버린다.
        console.log(str.substring(0,5)); //slicing str[0:5]
    </script>
</html>
