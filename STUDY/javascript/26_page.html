<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Java Script</title>
        <style></style>
    </head>
    <body>
        <p> == (느슨한 동등) : 필요하면 타입을 자동으로 변환해서 비교</p>
        <p> === (엄격한 동등) : 타입과 값을 모두 체크</p>
    </body>
    <script>
        // 1) 숫자와 문자열*
        console.log(2 == '2');
        console.log(2 === '2');

        // 2) 불린과 숫자
        console.log(false == 0);
        console.log(false === 0);

        // 3) 빈문자열과 불린
        console.log('' == false);
        console.log('' === false);

        // 4) null 과 undefined*
        console.log(null == undefined);
        console.log(null === undefined);

        // not 연산자 - 실행시 마다 뒤집히는 toggle 개념
        var flag = true;
        console.log('flag',flag);
        flag = !flag;
        console.log('flag',flag);
        flag = !flag;
        console.log('flag',flag);
    </script>
</html>
