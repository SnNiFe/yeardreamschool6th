<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <title>레이아웃에 영향을 미치는 속성 : display</title>
  
  <style>
    /*display: inline, block, none, inline-block*/
    p {
      width: 300px;
      height: 300px;
      background-color: pink;
      display: inline; /*기본 block -> inline 으로 변경*/
    }
    
    a {
      width: 300px;
      height: 300px;
      background-color: yellow;
      display: block; /*기본 inline -> block 으로 변경*/
      margin-top: 10px;
    }
  </style>
  
</head>
<body>

   <p>Block Element</p>
   <p>Block Element</p>
   <p>Block Element</p>
   
   <a href="#">Inline Element</a>
   <a href="#">Inline Element</a>
   <a href="#">Inline Element</a>

</body>
</html>
