<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>ECMA SCRIPT 6</title>
        <style>

        </style>
    </head>
    <body>
        <p>spread 연산자(...) 는 뭉쳐있는 것들을 펼쳐줍니다.</p>
    </body>
    <script>
        console.log([1,2,3],'->',...[1,2,3]);
        console.log('elice','->',...'elice');

        const arr1 = [1,2,3];
        const arr2 = [10,20,30];
        // result = arr1 + arr2 (pyhton 에서는 바로 가능)
        let result = [arr1,arr2];
        console.log(result);
        result = arr1.concat(arr2);
        console.log(result);
        //1,2,3,10,20,30
        result = [...arr1,...arr2];
        console.log(result);

        //shallow copy 문제 해결
        let x = [1,2,3,4,5];
        let y = [...x];
        x[4] = 'X';
        y[0] = 'Y';
        console.log([...x]);
        console.log([...y]);

        function total(...params){ // def total(*params):
            console.log(params); // array
            // params 에서 받은 값을 합하여 반환
            let result = 0;
            // for (let i=0; i<params.length; i++){
            //     result += parseInt(params[i]);
            // }
            for (const num of params){
                result += num;
            }
            return result; // paramss 의 합 반환
        }
        console.log('인지값 2개: ',total(10,20));
        console.log('인지값 3개: ',total(1,2,3));
        console.log('인지값 5개: ',total(1,2,3,4,5));

        // spread copy
        const user = {name:'홍길동',age:25};
        // key:value 형태여야 하는데 user 는?
        let person = {user,city:'서울'};
        console.log(person);
        // spread 를 사용하면 객체 안의 객체가 아닌
        // 동일선상의 속성으로 추가가 된다.
        person = {...user,city:'서울'};
        console.log(person);

    </script>
</html>
