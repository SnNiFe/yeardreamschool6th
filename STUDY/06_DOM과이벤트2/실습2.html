<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
  </head>
  <body>
    <form id="form">
      <label>입력</label>
      <input type="text" id="input">
      <button type="submit" id="btn">제출</button>
    </form>
    <h3 id="answer">답안</h3>
    <script>
        var form = document.getElementById('form');
        var h3 = document.getElementById('answer');

        form.addEventListener('submit',function(e){
            e.preventDefault();
            var txt = document.getElementById('input').value;
            console.log('click',txt);
            if (txt){
                h3.innerHTML = txt;
                document.getElementById('input').value = '';
            }else{
                alert('입력 내용을 넣어 주세요!');
            }
        });
    </script>
  </body>
</html>
