<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    a[target="_blank"]{
        color: blue;
        text-decoration: none;
        font: bold;
    }
    .box:first-child{
        background-color: #f5f5f5;
        padding: 10px;
    }
    ul > li{
        list-style-type: square;
        font-size: 10px;
    }
</style>
<body>
  <a href="https://example.com" target="_blank">새 창으로 열기</a>
  <a href="https://example.com">현재 창으로 열기</a>

  <div class="box">
    <p>첫 번째 자식 요소입니다.</p>
    <p>두 번째 자식 요소입니다.</p>
  </div>

  <ul>
    <li>리스트 항목 1</li>
    <li>리스트 항목 2</li>
  </ul>
</body>
</html>
