<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    #header button{
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
    }
    .active button{
        background-color: #0056b3;
        font: bold;
    }
    input[type="text"]{
        width: 100%;
        border: 1px solid #cccccc;
        padding: 8px;
    }
</style>
<body>
  <div id="header">
    <button type="button">기본 버튼</button>
    <button type="button" class="active">활성 버튼</button>
  </div>

  <form>
    <input type="text" placeholder="검색어를 입력하세요">
  </form>
</body>
</html>
