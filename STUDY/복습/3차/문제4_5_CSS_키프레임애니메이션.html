<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    .skeleton-loader{
        width: 100%;
        height: 50px;
        animation: shimer 1.2s linear infinite;
    }
    @keyframes shimer {
        0%{background-color: #e0e0e0;}
        50%{background-color: #f5f5f5;}
        100%{background-color: #e0e0e0;}
    }
</style>
<body>
  <div class="skeleton-loader"></div>
</body>
</html>
