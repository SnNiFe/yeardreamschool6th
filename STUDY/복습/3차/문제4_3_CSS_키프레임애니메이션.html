<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    .progress-bar{
        height: 20px;
        background-color: #007bff;
        animation: fillProgress 3s ease-out forwards;
    }
    @keyframes fillProgress {
        0%{width: 0%;}
        100%{width: 100%;}
    }
</style>
<body>
  <div class="progress-bar"></div>
</body>
</html>
