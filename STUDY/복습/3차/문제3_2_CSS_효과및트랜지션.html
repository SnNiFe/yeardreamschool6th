<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    .card-item{
        transition: all 0.4s ease 0s;
    }
    .card-item{
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        opacity: 0.8;
    }
    .card-item:hover{
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        opacity: 1;
    }
</style>
<body>
  <div class="card-item">
    <h3>카드 제목</h3>
    <p>카드 상세 설명입니다.</p>
  </div>
</body>
</html>
