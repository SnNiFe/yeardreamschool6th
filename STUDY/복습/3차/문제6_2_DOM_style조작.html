<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- <script defer src="index.js"></script> -->
</head>
<body>
  <button id="btnThin">얇은 실선</button>
  <button id="btnThick">두꺼운 실선</button>
  <button id="btnDashed">점선</button>

  <div id="box" style="width: 200px; height: 100px; margin-top: 10px;">박스 영역</div>
</body>
<script>
    /* index.js에 버튼 클릭 동작을 구현하세요. index.html과 index.css는 변경하지 마세요. */
    const btn1 = document.getElementById("btnThin");
    const btn2 = document.getElementById("btnThick");
    const btn3 = document.getElementById("btnDashed");
    const box = document.getElementById("box");
    btn1.addEventListener('click',function(e){
        e.preventDefault();
        box.style.border = '1px solid black';
    });
    btn2.addEventListener('click',function(e){
        e.preventDefault();
        box.style.border = '5px solid black';
    });
    btn3.addEventListener('click',function(e){
        e.preventDefault();
        box.style.border = '2px dashed red';
    });
</script>
</html>
