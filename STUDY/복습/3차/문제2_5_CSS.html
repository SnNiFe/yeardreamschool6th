<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    blockquote{
        border-left: 4px solid #007bff;
        padding-left: 15px;
        margin: 10px 0;
        font-style: italic;
        color: #555555;
    }
    .text-danger{
        color: #6c757d;
        font-size: 14px;
    }
</style>
<body>
  <blockquote>인용구 또는 명언 내용이 들어가는 블록입니다.</blockquote>
  <p class="text-danger">경고 또는 오류 메시지입니다.</p>
  <p class="text-muted">부가 설명 메시지입니다.</p>
</body>
</html>
