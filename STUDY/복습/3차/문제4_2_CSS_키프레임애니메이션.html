<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    .fade-in-box{
        animation: fadeIn 1.5s ease-in 0.5s forwards;
        opacity: 0;
    }
    @keyframes fadeIn {
        0%{opacity: 0; transform: translateY(20px);}
        100%{opacity: 1; transform: translateY(0);}
    }
</style>
<body>
  <div class="fade-in-box">서서히 나타나는 박스입니다.</div>
</body>
</html>
