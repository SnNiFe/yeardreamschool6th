<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<style>
    .profile-img{
        transition-property: transform;
        transition-duration: 0.5s;
        transition-timing-function: ease-out;
        transition-delay: 0s;
    }
    .profile-img{
        transform: rotate(0deg);
    }
    .profile-img:hover{
        transform: rotate(100deg);
    }
</style>
<body>
  <img src="profile.jpg" alt="프로필" class="profile-img">
</body>
</html>
