<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <title>CSS Transform, Animation</title>
  
  <style>

    .box1 {
        width: 300px;
        height: 300px;
        background-color: red;
        animation: rotation 1500ms linear 500ms infinite alternate none;
    }

    @keyframes rotation {
        from{
            transform: rotate(45deg) scale(0.1);
        }
        to{
            transform: rotate(-45deg) scale(0.5);
        }
    }

  </style>
  
</head>
<body>

  <div class="box1"></div>

</body>
</html>
