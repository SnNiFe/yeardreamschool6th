<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>실습11</title>
        <link rel="icon" href="chrome.png">
        <style>
            div{
                width: 300px;
                height: 300px;
                background-color: green;
                /*border
                border-color: black;
                border-width: 5px;
                border-style: dashed;
                */
                border: 1px solid red;
            }
            .bg_image{
                background-image: url(elice_logo.png);
                /*이미지가 요소보다 작을 경우 반복한다.*/
                /*반복은 repeat 속성을 통해 제어 가능*/
                background-repeat: no-repeat;
                /*x y*/
                /*top center bottom / left center right*/
                background-position: center top;
            }
        </style>
    </head>
    <body>
        <div></div>
        <div class="bg_image"></div>
    </body>
</html>
