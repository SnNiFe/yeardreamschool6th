<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>ECMA SCRIPT 6</title>
        <style>

        </style>
    </head>
    <body>
        <button>click</button>
    </body>
    <script>
        // 고차함수 - 함수를 인자값으로 받는 함수를 지칭 (백틱함수?)
        function repeat(n,action){
            for (let i = 0; i < n; i++){
                // action  은 실행할 함수(이름은 임의로 지어준 것)
                // sction 은 repeat 함수 실행시 마다 달라질 수 있다.
                action(i); 
            }
        }

        // repeat(3, function(n){console.log(`Hello - ${n}`);});
        repeat(3, n=>console.log(`Hello - ${n}`));

        // button 클릭시 '버튼 클릭' 이라는 콘솔이 출력 되도록 해 보자
        // document.getElementsByTagName('button')[0].addEventListener('click',()=>console.log('버튼 클릭'));
        let btn = document.getElementsByTagName('button')[0];
        btn.addEventListener('click',evt => console.log('버튼 클릭'));
    </script>
</html>
