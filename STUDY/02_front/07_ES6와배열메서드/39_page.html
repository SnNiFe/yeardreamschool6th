<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>ECMA SCRIPT 6</title>
        <style>

        </style>
    </head>
    <body>
        <p>비 구조할당 == 구조분해 할당</p>
    </body>
    <script>
        const user = {
            name:'홍길동',
            age:'25',
            city:'서울'
        };

        // 전통적방식 으로 이름과 나이 출력
        const name = user.name;
        const age = user.age;
        console.log(name,age);

        // 객체에서 필요한것만 분해해서 가져다 쓴다.
        // 규칙: 속성명(키) 가 변수명이 되어야 한다.
        //const {name,city} = user;
        // 이름이 겹칠 경우 임시 이름을 지어줄 수 있다.
        const {name:userName,city} = user;
        console.log(userName,city);

        // 새로운속성을 추가하거나 객체안의 객체도 꺼낼 수 있다.
        const person = {
            name:'Jhone',
            age:30,
            city:'NewYork',
            contact:{
                email:'Jhone@elice.io',
                phone:'02-6954-1105'
            }
        };

        const {name:user_name,contact:{email},grade='A'} = person;
        console.log(user_name);
        console.log(email); // 갹체안의 객체
        console.log(grade); // 추가된 내용
        
        // name, email, grade;
        // 모든 값을 다 출력해 보기
        const {name:pName,age:pAge,city:pCity,contact:{email:pEmail,phone}} = person;
        console.log('name:',pName); // : 으로 이름 정해서 중복 피하기
        console.log('age:',pAge);
        console.log('city:',pCity);
        console.log('email:',pEmail);
        console.log('phone:',phone);

        const {name:n , age:a,...etc} = person; // etc, rest 등 정하기 나름
        console.log('name:',n);
        console.log('age:',a);
        // 선택된 요소 외 나머지(rest) 를 사용한다고 해서
        // rest 문법이라고 부른다.
        console.log('etc:',etc); 

    </script>
</html>
