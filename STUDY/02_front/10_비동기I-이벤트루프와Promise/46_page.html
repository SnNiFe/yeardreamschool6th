<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>비동기</title>
        <style></style>
    </head>
    <body>

    </body>
    <script>
        console.log('=== 동기방식 ===');
        console.log('1. 프로그램 시작');
        console.log('2. 작업 시작');
        console.log('3. 프로그램 종료');

        console.log('=== 비동기방식 ===');
        console.log('1. 프로그램 시작');
        // 작업이 1시간 걸린다고 가정
        setTimeout(()=>console.log('2. 작업 시작'),100);
        console.log('3. 프로그램 종료');
        /*
            call stack : 해야할 일을 넣는다.
            비동기 처리될 내용은 일단 task queue 에 넣어둔다.
            그리고 이후 call stack 으로 불러와 처리
        */
    </script>
</html>
