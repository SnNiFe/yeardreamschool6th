<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Java Script</title>
        <style></style>
    </head>
    <body>

    </body>
    <script>
        var x = 10;
        var y = x;
        x = 20;
        console.log(x,y);

        var a = [1,2,3,4,5];
        var b = a;
        console.log("a : "+a.valueOf()); // 1,2,3,4,5
        console.log("b : "+b.valueOf()); // 1,2,3,4,5

        a[0] = 50;  // 50,2,3,4,5?
        b[4] = 100; // 1,2,3,4,100?

        console.log("a : "+a.valueOf()); // 50,2,3,4,100
        console.log("b : "+b.valueOf()); // 50,2,3,4,100
        /*
        a 의 값을 b에 대입할때 값을 복사해서 그대로 넣어줘야 한다. (휴대폰을 하나 더 사서 주는 개념)
        배열의 경우 덩치가 커질것을 우려해 대입시 위치 정보만 공유한다. (비싸니깐 휴대폰 위치만 공유한 개념)
        그래서 a 와 b에서 변경한 내용이 모두 반영되는것(shallow copy)
        */

        /*진짜로 독립되게 사용하고 싶다면? -> 노가다로 값을 하나하나 전달*/
        var src = [1,2,3,4,5];
        var dest = [];

        for (let i = 0; i < src.length; i++) {
            dest[i] = src[i];
        }

        src[0] = 'true';
        dest[5] = 'false';
        console.log('src : '+src.valueOf()); // true,2,3,4,5
        console.log('dest : '+dest.valueOf()); // 1,2,3,4,5,false

    </script>
</html>
