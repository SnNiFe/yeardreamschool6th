        var result = 0;

        var b = 2;
        // 2 부터 시작해서 자기자신이 나올때 까지 증가시키며 나눈다.
        for (a = 2; a <= 200; a++) {
            for(b = 2; b<=a; b++){
                // 3%1 3%2 3%3 -> 자기자신과 만났으니 소수
                // 4%1 4%2 -> 자기자신까지 오지 못했으므로 소수가 아님
                if(a%b==0){
                    //console.log(a+'%'+b+'='+(a%b));
                    break; // a 와 b 가 나누어 떨어지면 나머지연산을 중단 4%2 일 경우 중단
                }
            }
            if(a==b){
                //console.log(a+'=='+b);
                //console.log(a+' 는 소수 입니다.');
                result += a;
            }
        }
        console.log(result);
