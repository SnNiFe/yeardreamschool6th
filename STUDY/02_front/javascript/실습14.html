        // 지시사항에 따라 코드를 작성합니다.

            // return arr;

            var result = [];
            // 홀수 구분 - 수/2 = 나머지 1
            for (const num of inp) {
                if (num%2 > 0) {
                    result.push(num); // 배열에 새로 담기? 기존 배열에서 지워 나가기?
                }
            }
            return result;
        }

        console.log(getOnlyOddNumber(inputA));
