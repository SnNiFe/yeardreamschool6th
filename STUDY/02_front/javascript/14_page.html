    <script>
        //array 선언
        var arrNum = []; // 리터럴 방식
        var arrStr = new Array(); // 객체화 방식

        // 데이터 추가
        arrNum = [1,2,3,4];
        arrNum[4] = 5; // 방번호 지정 후 추가
        arrNum.push(6);
        console.log(arrNum);
        console.log(arrNum.length); // 배열의 길이를 알 수 있다.

        // 배열에 아무거나 다 넣어보자
        arrNum.push(1);
        arrNum.push("A");
        arrNum.push(false);
        arrNum.push([10,20,30]); // 
        arrNum.push(function(){console.log('함수 실행');});
        console.log(arrNum);
        console.log(arrNum[9]);
        arrNum[10](); // 함수 실행 시 매개변수를 담는 ()가 필요함

    </script>
