    <script>
        // 지시사항에 따라 코드를 작성합니다.
        function repeatString(str, num) {
            // var i = 1;
            // var text = str;
            // while (i < num) {
            //     text = text + str;
            //     i++;
            // }
            // return text;

            var text = str;
            for (let i = 1; i < num; i++) { // num 번
                text += str; // 문자열 합치기
            }
            return text;
        };

        var inputA = "hello";
        var inputB = 3;
        var answer = repeatString(inputA, inputB);
        console.log(answer);
