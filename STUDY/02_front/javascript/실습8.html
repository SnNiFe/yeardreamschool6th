    <script>
        // 지시사항에 따라 코드를 작성합니다.
        function addMiddleNumbers(arr){
            // 2번째, 5번째, 7번째 -> 1,4,6
            // 계란을 라면에 넣기 전에 접시에 깨서 넣는 방법
            // 설거지 거리가 생기지만, 계란 상태 확인 및 추가 작업이 가능하다.
            // var result = arr[1]+arr[4]+arr[6];
            // return result;
            // 계란을 라면에 막바로 넣는 방법
            // 설거지 거리를 늘리지 않는다.
            return arr[1]+arr[4]+arr[6];
        }
        // 1, 2, 3, 4, 5, 6, 7 부분을 자유롭게 바꾸어 가며 실행해 보세요.
        // 물론 현재 그대로 두어도 무방합니다. 제출 시의 채점과는 무관합니다.
        var inputA = [1, 2, 3, 4, 5, 6, 7];
        var result = addMiddleNumbers(inputA);
        console.log(result);
    </script>
