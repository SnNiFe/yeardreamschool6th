<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>this</title>
        <style>

        </style>
    </head>
    <body>
        <button>click</button>
    </body>
    <script>
        let btn = document.getElementsByTagName('button')[0];
        //console.log(btn);
        /*
        btn.addEventListener('click',function(evt){
            console.log(this); // this 는 내부적으로 event.currentTarget 과 연결
        });
        */
        
        // 화살표 함수는 정직하게 외부의 객체를 this 로 삼는다.
        btn.addEventListener('click',evt=> console.log(this));
    </script>
</html>
