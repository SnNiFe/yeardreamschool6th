<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>this</title>
        <style>

        </style>
    </head>
    <body>

    </body>
    <script>
        const global = 10;
        console.log('=== 함수 밖(전역) ===');
        console.log(global); // 10
        // [전역 context]
        outerFunc(); // [전역 context, outerFunc]

        function outerFunc(){
            const global = 20;
            const local1 = 30;
            console.log('=== OUTER FUNCTION ===');
            console.log(global); // 20
            console.log(local1);
            innerFunc(); // [전역 context, outerFunc, innerFunc]
            function innerFunc(){
                const local1 = 40;
                const local2 = 50;
                console.log('=== INNER FUNCTION ===');
                console.log(global); // 20
                console.log(local1);
                console.log(local2);
            } // [전역 context, outerFunc]
        } // [전역 context]
    // []
    </script>
</html>
