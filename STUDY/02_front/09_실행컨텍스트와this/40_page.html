<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>this</title>
        <style>

        </style>
    </head>
    <body>

    </body>
    <script>
        const obj = {
            name:'Elice',
            age:20,
            introduce:function(){
                // this 는 자신이 소속된 상위 객체를 의미
                // python 의 self 와 유사
                console.log(`My name is ${this.name} and I am ${this.age} years old`);
                console.log('Object this : ',this);
            }
        }
        //obj.introduce();

        //console.log('window',this); // 외부에서는 최상위 객체인 window 객체가 this 된다.

        // 함수 에서 this 는?
        // 함수가 소속된 오브젝트가 없다면 this 는 window 를 가르키게 된다.
        function outerFunc(){
            console.log('outer function : ',this); // window
            innerFunc();
            function innerFunc(){
                console.log('inner function :',this); // window
            }
        }
        //outerFunc();

        const hellobit = {name:'hellobit',age:20};
        const caterpiller = {name:'caterpiller',age:23};
        const cheshier = {name:'cheshire',age:26};

        function introduce(){
            console.log(`My name is ${this.name} and I am ${this.age} years old`);
            console.log('Object this : ',this);
        }
        // 강제로 함수에 특정 객체를 바인딩(연결)
        introduce.apply(hellobit);      // 바로실행, Apply -> Array : 매개변수를 담아 보내는 형식
        introduce.call(caterpiller);    // 바로실행, Call -> Comma : 매개변수를 담아 보내는 형식
        // 바로 실행하지 않고 실행 가능한 함수를 반환
        const func = introduce.bind(cheshier);
        func(); // 이후에 실행하면 된다.(매개변수는 실행시 전달하면 된다.)

        function addArgs(a,b){
            console.log(this,a,b);
        }

        addArgs.apply(hellobit,[1,2]);
        addArgs.call(caterpiller,3,4);
        // const args = addArgs.bind(cheshier);
        // args(5,6);
        addArgs.bind(cheshier)(5,6);

    </script>
</html>
