    <script>
        // 47_callback_hell.html 의 plus, multi, divide 함수를 Promise 객체를 활용하도록 변경
        function plus(a, b){
            return new Promise((resolve,reject)=>setTimeout(() => resolve(a+b),100));
        }
        function multi(a, b){
            return new Promise((resolve,reject)=>setTimeout(() => resolve(a*b),100));
        }
        function divide(a, b){
            return new Promise((resolve,reject)=>setTimeout(() => resolve(a/b),100));
        }
        // 사용1
        // plus(20,30)

        //     .then(r2=>divide(r2,2))
        //     .then(result=>console.log('(a+b)*c/d=',result));

        // Promise 객체를 반환하는 함수는 반드시 await 을 붙여야 한다.
        async function getResult(a,b){
            try{
                let r1 = await plus(a,b);
                let r2 = await multi(r1,4);
                let r3 = await divide(r2,2);
                console.log('(a+b)*c/d=',r3);
            }catch(err){ // try 실행 중 reject 가 발생되면 이쪽으로 튕긴다.
                console.error(err);
            }
        }
        getResult(20,30);
