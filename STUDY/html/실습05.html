<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>실습05</title>
        <link rel="icon" href="chrome.png">
    </head>
    <body>
        <!-- block : 블록처럼 쌓이는 속성 -->
        <h3>Hello</h3>
        <h3>Hello</h3>
        <h3>Hello</h3>
        <!-- inline : 줄 긋듯이 좌에서 우로 쌓이는 속성 -->
        <!-- HTML 에서는 1개 이상의 공백은 인정하지 않음 -->
        <!-- 그래서 공백문자를 활용 한다. -->
        <a href="#">link1</a>
        &nbsp; &nbsp; &nbsp; &nbsp;
        <a href="#">link2</a>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <a href="#">link3</a>
        <!-- div -->
        <div>block</div>
        <div>block</div>
        <div>block</div>
        <!-- sapn -->
        <span>inline</span>
        <span>inline</span>
        <span>inline</span>
    </body>
</html>
