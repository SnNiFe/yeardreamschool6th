<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>sprite image</title>
        <link rel="icon" href="chrome.png">
        <style>
            .bird1{
                width: 110px;
                height: 110px;
                /*background-image 는 좌표 지정이 안된다.*/
                background: url(spriteImg.png) -109px 0px;
            }
            .bird2{
                width: 110px;
                height: 110px;
                background: url(spriteImg.png) -3px -110px;
            }
        </style>
    </head>
    <body>
        <div class="bird1"></div>
        <div class="bird2"></div>
    </body>
</html>
